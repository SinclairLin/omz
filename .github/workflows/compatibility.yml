name: shell-compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh lua5.4 fd-find fzf lsof zoxide bat shellcheck

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install lua fd fzf zoxide ouch bat eza shellcheck

      - name: Check installed dependencies
        run: |
          zsh --version
          fzf --version
          fd --version || fdfind --version
          lua -v || lua5.4 -v

      - name: Check shell syntax
        run: |
          /bin/sh -n scripts/install_zsh_config.sh
          /bin/sh -n lib/file_preview.sh
          for file in lib/file_preview.sh tests/test_installer.sh; do
            bash -n "$file"
          done
          for file in omz.zsh lib/init.sh lib/*.zsh config/*.zsh themes/*.zsh-theme \
            scripts/*.zsh \
            functions/*.zsh \
            tests/test_runtime.zsh; do
            zsh -n "$file"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s sh scripts/install_zsh_config.sh lib/file_preview.sh
          fi

      - name: Test installer packages and isolated install/upgrade for all profiles
        run: PYTHONDONTWRITEBYTECODE=1 bash tests/test_installer.sh

      - name: Test runtime behavior
        run: zsh tests/test_runtime.zsh
